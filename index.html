<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signature Forgery Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>Signature Forgery Detection</h1>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="signature" required><br><br>
        <button type="submit">Check Signature</button>
    </form>

    {% if result %}
        <div class="result {{ 'forged' if 'FORGED' in result else 'genuine' }}">
            Result: {{ result }}
        </div>
    {% endif %}

</div>

</body>
</html>
